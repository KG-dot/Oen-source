<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Navbar</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #f3f6fb;
        color: #1f2937;
      }

      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 2rem;
        background: #ffffff;
        box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
      }

      .brand {
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #111827;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 1.4rem;
      }

      .nav-links a {
        color: #475569;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
      }

      .nav-links a:hover {
        color: #0f172a;
      }

      .button-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.72rem 1.4rem;
        border-radius: 999px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        font-weight: 600;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      .button-primary:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      .hero {
        max-width: 760px;
        margin: 3.5rem auto;
        padding: 0 2rem;
      }

      .hero h1 {
        font-size: clamp(2rem, 4vw, 3.5rem);
        margin: 0 0 1rem;
        line-height: 1.05;
      }

      .hero p {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.8;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <div class="brand">Kadidi Studio</div>
      <nav class="nav-links">
        <a href="#features">Features</a>
        <a href="#pricing">Pricing</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <a class="button-primary" href="#get-started">Get Started</a>
    </header>

    <main class="hero">
      <h1>Build polished experiences with a clean, professional navbar.</h1>
      <p>
        This page now includes a refined navigation bar, clear menu links, and a strong call-to-action for a more modern presentation.
      </p>
    </main>
  </body>
</html>
